<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>U-Caption</title>
<style>
  body { width: 320px; font-family: -apple-system, "Segoe UI", sans-serif; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #status { font-size: 12px; margin-bottom: 10px; }
  button { width: 100%; padding: 8px; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
  #output {
    white-space: pre-wrap;
    font-size: 12px;
    max-height: 260px;
    overflow-y: auto;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    min-height: 40px;
  }
</style>
</head>
<body>
  <h1>U-Caption</h1>
  <div id="status">연결 상태 확인 중...</div>
  <button id="fetchBtn">지금 보고 있는 영상 자막 가져오기</button>
  <div id="output">Claude에서 유튜브 링크를 주면 자동으로 자막을 전달합니다. (이 버튼은 수동 확인용)</div>
  <script src="popup.js"></script>
</body>
</html>
